name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: map-build/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install transform dependencies
        run: python -m pip install -r map-build/requirements.txt

      - name: Cache Natural Earth sources
        uses: actions/cache@v4
        with:
          path: |
            map-build/.cache/ne
            map-build/.cache/ne-raster
          key: natural-earth-${{ hashFiles('map-build/natural-earth/build_natural_earth.py', 'map-build/natural-earth/build_terrain.py') }}

      - name: Build the Natural Earth archive
        run: python map-build/natural-earth/build_natural_earth.py --force --quiet --report map-build/.work/natural-earth-report.json

      - name: Build the terrain overlays
        run: python map-build/natural-earth/build_terrain.py --force --quiet --report map-build/.work/natural-earth-terrain-report.json

      - name: Typecheck
        run: npm run typecheck

      - name: Coordinate API tests
        run: npm test

      - name: Natural Earth build tests
        env:
          PYTHONHASHSEED: "0"
        run: python -m unittest discover -s map-build/natural-earth -p "test_*.py" -v

      - name: Geometry transform tests
        env:
          PYTHONHASHSEED: "0"
        run: python -m unittest discover -s map-build/transformations -p "test_*.py" -v

      - name: Build static site
        run: npm run build

      - name: Check deployment budget
        run: node map-build/scripts/check-size.mjs dist --require-data

      - name: Browser smoke test
        run: npm run test:browser
