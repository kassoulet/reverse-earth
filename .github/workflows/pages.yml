name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish map data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A failed map-data build must not redeploy the site. Pushes and manual
    # dispatches do not have a workflow_run payload, hence the short circuit.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Provide and verify world.pmtiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p public/data
          used_release=0
          if [ -f public/data/world.pmtiles ]; then
            echo "Using the world.pmtiles already in the checkout."
          else
            used_release=1
            echo "Looking for world.pmtiles and its checksum on the latest GitHub release..."
            if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern 'world.pmtiles*' --dir public/data; then
              echo "::error title=Map data missing::No public/data/world.pmtiles and no world.pmtiles asset on the latest GitHub release. Run npm run map:build, attach the archive to a release, and redeploy. See README.md."
              exit 1
            fi
          fi
          test -s public/data/world.pmtiles
          if [ "$used_release" -eq 1 ]; then
            if [ ! -s public/data/world.pmtiles.sha256 ]; then
              echo "::error title=Checksum missing::The latest release has no world.pmtiles.sha256 asset. Republish it with the Publish map data workflow."
              exit 1
            fi
            (cd public/data && sha256sum -c world.pmtiles.sha256)
          fi
          ls -lh public/data/world.pmtiles

      - name: Work out the Pages base path
        id: base
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}
        run: npm run build

      - name: Enforce the Pages storage budget
        run: node map-build/scripts/check-size.mjs dist --require-data

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site on the first deployment; later runs reuse it.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
