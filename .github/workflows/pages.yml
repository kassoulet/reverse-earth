name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Provide world.pmtiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/data
          if [ -f public/data/world.pmtiles ]; then
            echo "Using the world.pmtiles already in the checkout."
          else
            echo "Looking for world.pmtiles on the latest GitHub release..."
            if ! gh release download --repo "$GITHUB_REPOSITORY" --pattern world.pmtiles --dir public/data; then
              echo "::error title=Map data missing::No public/data/world.pmtiles and no world.pmtiles asset on the latest GitHub release. Build the archive and attach it to a release before deploying. See README.md."
              exit 1
            fi
          fi
          test -s public/data/world.pmtiles
          ls -lh public/data/world.pmtiles

      - name: Work out the Pages base path
        id: base
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          VITE_BASE: ${{ steps.base.outputs.base }}
        run: npm run build

      - name: Enforce the Pages storage budget
        run: node map-build/scripts/check-size.mjs dist --require-data

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
