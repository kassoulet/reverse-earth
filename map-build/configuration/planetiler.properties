# Planetiler OpenMapTiles build for the south-up map.
#
# The latitude inversion happens AFTER this step, in
# transformations/flip_world.py. Keeping it after tile generation means every
# source used by the OpenMapTiles profile is inverted consistently: OSM
# geometry, the water-polygon ocean source and Natural Earth data.
#
# Build target: native zooms 0-9 are mandatory; 10 is attempted when the
# resulting archive stays inside the storage budget. The build script sets
# --maxzoom explicitly, so this file's value is only a default.

minzoom=0
maxzoom=10

# Everything needed by public/style.json, and nothing that only matters for
# street-level browsing. Buildings, addresses and dense POIs are excluded.
only_layers=water,waterway,water_name,landcover,landuse,park,boundary,transportation,transportation_name,place,aerodrome_label,mountain_peak
exclude_layers=building,housenumber,poi,aeroway

# Emit local names plus name:latin/name:en. The style prefers name:latin, then
# name, then name:en, avoiding the full Wikidata translation set.
use_wikidata=false
languages=en
transliterate=true

# More CPU, less temporary disk. Planetiler's planet build is disk-hungry.
compress_temp=true

# Keep the road-name merging behaviour that produces fewer, longer label lines.
transportation_name_limit_merge=true
transportation_z13_paths=false

# Do NOT set free_osm_after_read here: it deletes the user's input .osm.pbf.
# The wrapper script never deletes an input file it did not download.

# MBTiles intermediate compression. The transform rewrites tiles as gzip and
# writes the final PMTiles archive with gzip tile compression.
tile_compression=gzip
